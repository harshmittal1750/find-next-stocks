[tool.uv.workspace]
members = ["apps/api", "packages/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["apps/web", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["packages/pipeline/tests", "apps/api/tests"]
