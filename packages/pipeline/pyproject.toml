[project]
name = "find-next-pipeline"
version = "0.1.0"
description = "Provenance-first equity data ingestion and normalization"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb==1.5.4",
    "httpx>=0.28.1,<0.29",
    "pandas>=2.3,<4",
    "pyarrow>=20,<24",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "typer>=0.16,<1",
    # Yahoo rotates a cookie+crumb scheme on the endpoints that carry holder data.
    # Hand-rolling it in httpx returned 429 and could not even be tested; yfinance
    # tracks the scheme and worked while raw requests were throttled.
    "yfinance>=0.2.60,<0.3",
]

[project.scripts]
fetch-market-data = "find_next_pipeline.cli:fetch"
archive-csv-data = "find_next_pipeline.csv_archive:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_next_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]
