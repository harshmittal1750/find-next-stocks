[project]
name = "find-next-api"
version = "0.1.0"
description = "FastAPI service for Find Next Stocks"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.139.2",
    "find-next-pipeline",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_next_api"]

[tool.uv.sources]
find-next-pipeline = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]
